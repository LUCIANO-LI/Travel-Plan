<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Plan | 旅行计划</title>
<style>
:root {
  --bg: #f0f2f5;
  --paper: #fff;
  --ink: #263445;
  --muted: #667085;
  --line: #d8e1ea;
  --brand: #0f5d63;
  --brand2: #1f4e78;
  --accent: #c46a35;
  --soft: #eef7f6;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  min-height: 100vh;
}

/* ── 顶部标题栏 ── */
.header {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 54px;
  background: #20242b;
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 22px;
  box-shadow: 0 2px 10px rgba(0,0,0,.25);
  font-size: 17px;
  font-weight: 700;
  gap: 8px;
}

.header-icon { font-size: 22px; }

/* ── 主内容区 ── */
.main {
  max-width: 720px;
  margin: 0 auto;
  padding: 28px 16px 60px;
}

.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 14px;
}

/* ── 卡片网格 ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

/* ── 攻略卡片 ── */
.card {
  display: flex;
  flex-direction: column;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  text-decoration: none;
  color: inherit;
  transition: box-shadow .2s, border-color .2s, transform .15s;
  position: relative;
  overflow: hidden;
}

.card:hover {
  border-color: var(--brand);
  box-shadow: 0 8px 24px rgba(15,93,99,.12);
  transform: translateY(-2px);
}

.card-emoji {
  font-size: 36px;
  line-height: 1;
  margin-bottom: 12px;
}

.card-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--brand);
  margin-bottom: 6px;
  line-height: 1.3;
}

.card-subtitle {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 12px;
}

.card-route {
  font-size: 12px;
  font-weight: 700;
  color: var(--brand2);
  background: #f0f6fa;
  border-radius: 6px;
  padding: 6px 10px;
  margin-bottom: 12px;
  letter-spacing: .02em;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: auto;
}

.tag {
  display: inline-block;
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.tag-brand {
  background: var(--soft);
  color: var(--brand);
}

.tag-accent {
  background: #fff4ea;
  color: var(--accent);
}

.card-arrow {
  position: absolute;
  right: 16px;
  bottom: 18px;
  font-size: 18px;
  color: var(--brand);
  opacity: .4;
  transition: opacity .2s, transform .2s;
}

.card:hover .card-arrow {
  opacity: 1;
  transform: translateX(3px);
}

/* ── 占位卡片 ── */
.card-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--paper);
  border: 2px dashed var(--line);
  border-radius: 12px;
  padding: 32px 20px;
  text-align: center;
  min-height: 200px;
}

.card-placeholder .card-emoji {
  opacity: .5;
}

.card-placeholder .card-title {
  color: var(--muted);
  font-size: 15px;
}

.card-placeholder .card-subtitle {
  margin-bottom: 0;
}

/* ── 页脚 ── */
.footer {
  text-align: center;
  padding: 20px 16px 32px;
  font-size: 12px;
  color: #98a2b3;
}

/* ── 响应式：手机端 ── */
@media (max-width: 600px) {
  .header { height: 48px; font-size: 15px; padding: 0 16px; }
  .main { padding: 20px 14px 48px; }
  .card-grid { grid-template-columns: 1fr; gap: 14px; }
  .card { padding: 18px 16px; }
  .card-emoji { font-size: 30px; margin-bottom: 10px; }
  .card-title { font-size: 16px; }
  .card-placeholder { min-height: 120px; padding: 24px 16px; }
}
</style>
</head>
<body>

<!-- 顶部标题栏 -->
<div class="header">
  <span class="header-icon">🌏</span>
  <span>Travel Plan</span>
</div>

<!-- 主内容区 -->
<div class="main">
  <div class="section-title">我的旅行攻略</div>
  <div class="card-grid">

    <!-- 台湾攻略卡片 -->
    <a class="card" href="Taiwan/taiwanplan.html">
      <div class="card-emoji">🇹🇼</div>
      <div class="card-title">台湾 6天5晚执行版行程</div>
      <div class="card-subtitle">小红书听劝校准 · 轻松休闲 · 顺路不折返</div>
      <div class="card-route">台北 → 台中 → 台南 → 高雄</div>
      <div class="card-tags">
        <span class="tag tag-brand">6天5晚</span>
        <span class="tag tag-accent">西部主线</span>
      </div>
      <span class="card-arrow">→</span>
    </a>

    <!-- 伦敦攻略卡片 -->
    <a class="card" href="London/londonplan.html">
      <div class="card-emoji">🇬🇧</div>
      <div class="card-title">伦敦 3天2夜执行版行程</div>
      <div class="card-subtitle">地标打卡 · 街区漫步 · 西区音乐剧</div>
      <div class="card-route">Westminster → Thames → West End → Sky Garden → Heathrow</div>
      <div class="card-tags">
        <span class="tag tag-brand">3天2夜</span>
        <span class="tag tag-accent">城市精华</span>
      </div>
      <span class="card-arrow">→</span>
    </a>

    <!-- 占位卡片 -->
    <div class="card-placeholder">
      <div class="card-emoji">🔜</div>
      <div class="card-title">更多目的地</div>
      <div class="card-subtitle">敬请期待...</div>
    </div>

  </div>
</div>

<!-- 页脚 -->
<div class="footer">Travel Plan · 旅行计划集合</div>

</body>
</html>
